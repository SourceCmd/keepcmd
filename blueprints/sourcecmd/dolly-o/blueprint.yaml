  harnesses: [claude-code, codex]
  model: capable

skills: []

asks:
  tools:
    - tool: WebSearch
      why: Looks up news, prices and rates before relying on them.
    - tool: WebFetch
      why: Reads the pages it finds.
  network:
    - open: web
      why: Follows sources wherever they are (filings, central banks, data).
  own_folder:
    access: read-write
    why: Keeps its view of the machine and its current book, and reads them before answering.
  folders:
    - access: read
      label: Your statements
      why: Reads the statements you keep, so its calls fit what you own.

